name: 集計表 判定式 親子ラップ（sheet-fix wrap）

# 手動実行専用。CR停止判定セルに親子分類（親子行）を参照するラップを付与する。
# inspect-sheet と同じ GOOGLE_SERVICE_ACCOUNT_JSON を使用。
# mode=dry-run（デフォルト）は書き込みなし。apply 時のみ書き込み、undoログをアーティファクト保存。
on:
  workflow_dispatch:
    inputs:
      sheet:
        description: "スプレッドシートID または URL"
        required: true
      tab:
        description: "タブ名（例: meta_total）"
        required: true
      judge_row:
        description: "停止判定が入る行（1始まり。案件により異なる。構造ダンプで実測）"
        required: true
        default: "3"
      parent_row:
        description: "親子分類プルダウンの行（1始まり。通常2）"
        required: true
        default: "2"
      mode:
        description: "dry-run: 対象確認のみ / apply: 実際に書き込む"
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

jobs:
  wrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: scripts/sheet-fix
        run: npm install --no-audit --no-fund
      - name: Wrap judgment cells
        working-directory: scripts/sheet-fix
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET: ${{ github.event.inputs.sheet }}
          TAB: ${{ github.event.inputs.tab }}
          JUDGE_ROW: ${{ github.event.inputs.judge_row }}
          PARENT_ROW: ${{ github.event.inputs.parent_row }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          APPLY_FLAG=""
          if [ "$MODE" = "apply" ]; then APPLY_FLAG="--apply"; fi
          node wrap_judgment.mjs --sheet "$SHEET" --tab "$TAB" --judge-row "$JUDGE_ROW" --parent-row "$PARENT_ROW" $APPLY_FLAG --undo-out undo_log.json
      - name: Upload undo log
        if: github.event.inputs.mode == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: wrap-undo-log
          path: scripts/sheet-fix/undo_log.json
          if-no-files-found: ignore
          retention-days: 90
