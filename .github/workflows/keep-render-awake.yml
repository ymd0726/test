name: Render スリープ防止（video-material-matcher）

# Render の無料/低位プランは約15分間アクセスが無いとスリープする。
# 10分間隔でヘルスチェックURLへHTTPリクエストを送り、スリープを防ぐ。
# GitHub Actions の cron は UTC 固定だが本ワークフローはJST変換不要（常時10分毎）。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # 手動テスト実行用（Actions画面の "Run workflow"）

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -fsS --max-time 30 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            "https://video-material-matcher.onrender.com/"
