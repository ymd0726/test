name: Render スリープ防止（video-material-matcher）

# Render の無料/低位プランは約15分間アクセスが無いとスリープする。
# 10分間隔でヘルスチェックURLへHTTPリクエストを送り、スリープを防ぐ。
#
# Render無料プランは750時間/月（アカウント内の無料サービス合算）が上限。
# 24時間365日起こし続けると720〜744時間/月に達し上限ギリギリになるため、
# 平日(月〜金) 8:00〜23:00頃(JST)のみ稼働させ、夜間・土日はスリープを許容する
# （目安 約300〜350時間/月で上限に大きく余裕を持たせる）。
#
# GitHub Actions の cron は UTC 固定（JST = UTC+9）。
# JST月〜金 8:00〜22:59 は UTC で以下の2つに分割される:
#   - UTC 0:00〜13:59 の 月〜金（= JST 9:00〜22:59 月〜金）
#   - UTC 23:00〜23:59 の 日〜木（= JST 8:00〜8:59 月〜金）
on:
  schedule:
    - cron: "*/10 0-13 * * 1-5"
    - cron: "*/10 23 * * 0-4"
  workflow_dispatch: # 手動テスト実行用（Actions画面の "Run workflow"）

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          curl -fsS --max-time 30 -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            "https://video-material-matcher.onrender.com/"
