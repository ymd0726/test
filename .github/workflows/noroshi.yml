name: 集計表 当たりの狼煙（noroshi）

# 手動実行専用。CPAが目標を下回る「当たり予備軍」を消化金額列の別行に表示専用で点灯させる。
# inspect-sheet と同じ GOOGLE_SERVICE_ACCOUNT_JSON を使用。
# mode=dry-run（デフォルト）は書き込みなし＋実データで点灯予測。apply 時のみ書き込み・undoログ保存。
on:
  workflow_dispatch:
    inputs:
      sheet:
        description: "スプレッドシートID または URL"
        required: true
      tab:
        description: "タブ名（例: kk_mak）"
        required: true
      target_cell:
        description: "目標CPAセル（例: W5）"
        required: true
        default: "W5"
      spendline_cell:
        description: "消化判定ラインセル（例: W3）"
        required: true
        default: "W3"
      metric_row:
        description: "指標の判定参照行（例: 1100）"
        required: true
        default: "1100"
      noroshi_row:
        description: "のろしを書く行（当たりプルダウンと同じ列の空き行。例: 7）"
        required: true
        default: "7"
      id_row:
        description: "cr識別子の行（例: 6）"
        required: true
        default: "6"
      cv_min:
        description: "実質cvの最小件数（既定3）"
        required: true
        default: "3"
      cpa_factor:
        description: "CPAしきい係数（目標CPA×係数。1.0=目標以下、0.8=目標の8割以下）"
        required: true
        default: "1.0"
      mode:
        description: "dry-run: 点灯予測のみ / apply: 実際に式を書き込む"
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

jobs:
  noroshi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: scripts/sheet-fix
        run: npm install --no-audit --no-fund
      - name: Generate noroshi cells
        working-directory: scripts/sheet-fix
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET: ${{ github.event.inputs.sheet }}
          TAB: ${{ github.event.inputs.tab }}
          TARGET_CELL: ${{ github.event.inputs.target_cell }}
          SPENDLINE_CELL: ${{ github.event.inputs.spendline_cell }}
          METRIC_ROW: ${{ github.event.inputs.metric_row }}
          NOROSHI_ROW: ${{ github.event.inputs.noroshi_row }}
          ID_ROW: ${{ github.event.inputs.id_row }}
          CV_MIN: ${{ github.event.inputs.cv_min }}
          CPA_FACTOR: ${{ github.event.inputs.cpa_factor }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          APPLY_FLAG=""
          if [ "$MODE" = "apply" ]; then APPLY_FLAG="--apply"; fi
          node noroshi.mjs --sheet "$SHEET" --tab "$TAB" \
            --target-cell "$TARGET_CELL" --spendline-cell "$SPENDLINE_CELL" \
            --metric-row "$METRIC_ROW" --noroshi-row "$NOROSHI_ROW" --id-row "$ID_ROW" \
            --cv-min "$CV_MIN" --cpa-factor "$CPA_FACTOR" $APPLY_FLAG --undo-out undo_log.json
      - name: Upload undo log
        if: github.event.inputs.mode == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: noroshi-undo-log
          path: scripts/sheet-fix/undo_log.json
          if-no-files-found: ignore
          retention-days: 90
