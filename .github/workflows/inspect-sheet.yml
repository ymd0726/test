name: 集計表 構造ダンプ（cr入稿くん Phase 0）

# 手動実行専用。ad-analysis と同じ GOOGLE_SERVICE_ACCOUNT_JSON シークレットを使い、
# 対象集計表タブの CR00 ブロック構造を読み取り専用でダンプする。
on:
  workflow_dispatch:
    inputs:
      sheet:
        description: "スプレッドシートID または URL"
        required: true
        default: "1oEK8JCJg2NcseWmnxLtfNFCe5A7XGJ_DJSj7c2EW1sg"
      tab:
        description: "タブ名（空なら cr00 を含む全タブを自動検出）"
        required: false
        default: ""
      dump:
        description: "true で対象タブの非空セルを A1:値 で全ダンプ（tab指定時のみ有効）"
        required: false
        default: "false"
      merges:
        description: "true で各crブロックのサムネ表示セル（結合セル）有無を診断（tab指定時のみ有効）"
        required: false
        default: "false"
      verifyZones:
        description: "true でレジストリ全案件のゾーン判定（旧/新）を比較（sheet/tab入力は無視）"
        required: false
        default: "false"
      verifyOnly:
        description: "verifyZones時、対象案件をカンマ区切りで限定（例 nrn,ssh）。空なら全案件"
        required: false
        default: ""
      formulas:
        description: "true でダンプを値ではなく数式（FORMULA）で出力（dump=true時のみ有効。判定式のラップ確認用）"
        required: false
        default: "false"
      rows:
        description: "ダンプ対象行をカンマ区切りで限定（例: 2,3,5。空なら全行）"
        required: false
        default: ""
      cells:
        description: "任意セルをカンマ区切りで値/式読取（例: AI1100,AU1100。tab必須。指定時はこれのみ実行）"
        required: false
        default: ""
      colors:
        description: "true で --cells の結果に背景色(effective/userEntered)も表示（グレー化漏れの調査用）"
        required: false
        default: "false"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        working-directory: scripts/cr-submit
        run: npm install --no-audit --no-fund
      - name: Inspect sheet structure
        working-directory: scripts/cr-submit
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ github.event.inputs.verifyZones }}" = "true" ]; then
            ONLY=""
            if [ -n "${{ github.event.inputs.verifyOnly }}" ]; then ONLY="--only ${{ github.event.inputs.verifyOnly }}"; fi
            node verify_zone_fix.mjs $ONLY
            exit $?
          fi
          DUMP=""
          if [ "${{ github.event.inputs.dump }}" = "true" ]; then DUMP="--dump"; fi
          if [ "${{ github.event.inputs.merges }}" = "true" ]; then DUMP="$DUMP --merges"; fi
          FORMULAS=""
          if [ "${{ github.event.inputs.formulas }}" = "true" ]; then FORMULAS="--formulas"; fi
          ROWS=""
          if [ -n "${{ github.event.inputs.rows }}" ]; then ROWS="--rows ${{ github.event.inputs.rows }}"; fi
          CELLS=""
          if [ -n "${{ github.event.inputs.cells }}" ]; then CELLS="--cells ${{ github.event.inputs.cells }}"; fi
          COLORS=""
          if [ "${{ github.event.inputs.colors }}" = "true" ]; then COLORS="--colors"; fi
          if [ -n "${{ github.event.inputs.tab }}" ]; then
            node inspect_sheet.mjs --sheet "${{ github.event.inputs.sheet }}" --tab "${{ github.event.inputs.tab }}" $DUMP $FORMULAS $ROWS $CELLS $COLORS
          else
            node inspect_sheet.mjs --sheet "${{ github.event.inputs.sheet }}" --json
          fi
